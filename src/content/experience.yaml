# Experience, newest first.
#
# The order of this list is the order on the site. The first entry is the
# lead feature at the top of the home page, so adding a newer job at the top
# changes the lead with no layout edits.
#
# An entry with a `caseStudy` gets its own page at /work/<id>/.
# Search for "TODO(brian)" to find slots that still need real content.

- id: mealvue
  company: MealVue
  role: Full-Stack Software Developer
  start: 2026-09
  location: Remote
  summary: >-
    Part of the small team behind Mealvue Chef, a kitchen inventory, recipe and
    meal planning app that is live on the App Store and Google Play.
  caseStudy:
    intro: >-
      Mealvue Chef by MealLens Inc. is a kitchen inventory, recipe and meal
      planning app. You scan a fridge shelf, a barcode or a receipt, and it
      works out what you have, finds recipes, tracks expiry dates and builds a
      shopping list.
    facts:
      - label: Team
        value: Built by a small team. I work across the app and the API.
      - label: Status
        value: Live on the App Store (Sep 29, 2026) and Google Play (Oct 7, 2026)
    problem:
      - >-
        The app was getting a full V2 redesign, and the existing code made that
        harder than it needed to be. Single screens had grown to as many as
        4,800 lines, and a large share of the codebase was no longer used.
      - >-
        It also felt slow. A tap took about 350 ms to respond, saving to the
        device was slow, and expiry dates could show up a day early.
    built:
      - >-
        Built the V2 redesign of the React Native and Expo app from Figma: 10
        screens on a token-based design system.
      - >-
        Extended the Django REST and PostgreSQL API with meal plans, stock
        baselines and typo-tolerant parsing.
      - >-
        Cut tap latency by stopping hidden tabs and unchanged rows from
        re-rendering.
      - >-
        Switched local storage from AsyncStorage to MMKV to speed up writes to
        disk.
      - >-
        Split monolithic screens into hooks and a service layer.
      - >-
        Removed dead code and unused endpoints, found with import-graph
        reachability analysis.
      - >-
        Fixed a UTC time zone bug that showed expiry dates a day early, and an
        iOS native crash when a sheet unmounted.
    stack:
      - label: App
        items: [React Native, Expo]
      - label: API and data
        items: [Django REST Framework, PostgreSQL]
      - label: Device storage
        items: [MMKV]
    results:
      - value: 81%
        label: lower tap latency, from 350 ms to 65 ms
      - value: 24K+
        label: lines of dead code removed, 29% of the codebase
      - value: 99.9%
        label: faster writes to disk after moving to MMKV
      - value: 68%
        label: fewer dependencies after splitting the largest screens
    outcomes:
      - 10 redesigned screens shipped on a token-based design system.
      - 25 unused API endpoints removed.
      - The expiry date bug and the iOS sheet crash are fixed.
    links:
      # TODO(brian): add the App Store link for Mealvue Chef.
      - label: App Store
        kind: store
      # TODO(brian): add the Google Play link for Mealvue Chef.
      - label: Google Play
        kind: store
    # TODO(brian): add store screenshots to src/assets/work and list them
    # under `images` (file, alt, caption). Then delete this slot.
    imageTodos:
      - Mealvue Chef store screenshots

