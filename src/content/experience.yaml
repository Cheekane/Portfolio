- id: jitto
  company: Jitto
  role: Full-Stack Software Engineer Intern
  start: 2024-09
  end: 2025-08
  location: Etobicoke, Ontario
  summary: >-
    Led a data pipeline that replaced 10+ hours a week of manual price list
    work, and repainted the online storefront with Tailwind CSS.
  caseStudy:
    intro: >-
      A year-long internship with two main jobs. I was in charge of building a
      data pipeline that uses tuned algorithms to extract price list data, and
      I did the repaint and refactor of the online storefront using Tailwind
      CSS.
    facts:
      - label: Role
        value: Full-Stack Software Engineer Intern, Sep 2024 to Aug 2025
      - label: Platform
        value: $2.5M+ in revenue
    problem:
      - >-
        Getting data out of price lists was manual work that took more than 10
        hours every week.
      - >-
        The storefront needed a visual refresh, its pages loaded slower than
        they should, and transaction flows had decimal-precision bugs in the
        REST API.
    built:
      - >-
        Led an AWS and Python data pipeline, built with Polars, that extracts
        price list data with tuned algorithms.
      - >-
        Wrote unit tests that run in CI/CD on every push, with pull request
        approval gated on the full suite passing.
      - >-
        Refactored React and TypeScript components and migrated the styling to
        Tailwind CSS.
      - >-
        Wrote Bash scripts that trim dependencies out of AWS Lambda packages.
      - >-
        Fixed REST API decimal-precision bugs in transaction flows.
    stack:
      - label: Data pipeline
        items: [Python, Polars, AWS Lambda, Bash]
      - label: Storefront
        items: [React, TypeScript, Tailwind CSS]
      - label: Quality
        items: [Unit tests, CI/CD]
    results:
      - value: 10+ hrs
        label: of manual work removed every week
      - value: 90%+
        label: extraction accuracy from the pipeline
      - value: 30%
        label: faster load times on the storefront
      - value: 99%
        label: smaller AWS Lambda package
    outcomes:
      - Every pull request has to pass the full test suite before approval.
      - Transaction amounts keep their decimal precision through the API.

